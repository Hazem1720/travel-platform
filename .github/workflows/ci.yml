name: CI
on:
  pull_request:
jobs:
  test-plan:
    name: Test plan ${{ matrix.part }} (TEMP)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part:
          - part15-edge.e2e-spec.ts
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run part
        run: npx jest --config ./test/jest-e2e.json --runInBand test/${{ matrix.part }}
