name: CI
on:
  pull_request:
jobs:
  test-plan:
    name: Test plan ${{ matrix.part }} (TEMP)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part:
          - part1-accounts.e2e-spec.ts
          - part10-admin.e2e-spec.ts
          - part11-e2e.e2e-spec.ts
          - part12a.e2e-spec.ts
          - part12b.e2e-spec.ts
          - part13-robustness.e2e-spec.ts
          - part2-general.e2e-spec.ts
          - part3-flights-mgmt.e2e-spec.ts
          - part4-flight-booking.e2e-spec.ts
          - part5-hotels-mgmt.e2e-spec.ts
          - part6-hotel-booking.e2e-spec.ts
          - part7-payments.e2e-spec.ts
          - part8-itineraries.e2e-spec.ts
          - part9-blog.e2e-spec.ts
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run part
        run: npx jest --config ./test/jest-e2e.json --runInBand test/${{ matrix.part }}
