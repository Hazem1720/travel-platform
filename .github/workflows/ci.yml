name: CI
on:
  pull_request:
jobs:
  unit-coverage:
    name: Unit coverage (TEMP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx jest --coverage --coverageReporters=json-summary --coverageReporters=text-summary
      - run: node -e "const s=require('./coverage/coverage-summary.json');const rows=Object.entries(s).filter(([k])=>k!=='total').map(([k,v])=>[k.replace(/.*src\//,''),v.lines.pct,v.branches.pct,v.lines.total-v.lines.covered]).sort((a,b)=>b[3]-a[3]);console.log('TOTAL',JSON.stringify(s.total.lines),JSON.stringify(s.total.branches));for(const r of rows.slice(0,70))console.log('ROW',r.join(' | '))"
  e2e-coverage:
    name: E2E coverage (TEMP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx jest --config ./test/jest-e2e.json --runInBand --forceExit --coverage --collectCoverageFrom='<rootDir>/../src/**/*.ts' --collectCoverageFrom='!<rootDir>/../src/**/*.spec.ts' --coverageReporters=json-summary --coverageReporters=text-summary test/ || true
      - run: node -e "const s=require('./coverage/coverage-summary.json');const rows=Object.entries(s).filter(([k])=>k!=='total').map(([k,v])=>[k.replace(/.*src\//,''),v.lines.pct,v.branches.pct,v.lines.total-v.lines.covered]).sort((a,b)=>b[3]-a[3]);console.log('TOTAL',JSON.stringify(s.total.lines),JSON.stringify(s.total.branches));for(const r of rows.slice(0,70))console.log('ROW',r.join(' | '))"
