name: CI
on:
  pull_request:
  push:
    branches: [develop, main]
jobs:
  test-plan:
    name: Test plan Part 2 again (TEMP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run Part 2 again
        run: npx jest --config ./test/jest-e2e.json --runInBand test/part2-general.e2e-spec.ts
