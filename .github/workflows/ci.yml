name: CI

# Builds and tests the backend on every pull request and on pushes to the
# main branches. Needs no secrets: unit tests use placeholder settings and
# never connect to a database.
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
