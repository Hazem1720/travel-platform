name: CI
on:
  pull_request:
jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx jest --coverage --coverageReporters=json --silent
      - run: npx jest --config ./test/jest-e2e-cov.json --runInBand --forceExit --coverage --silent || true
      - run: node test/merge-cov.js
