name: CI
on:
  pull_request:
jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prettier --write "test/**/*.ts" "src/**/*.ts" > /dev/null
      - run: echo DIFF-START; git diff --no-color -- test src; echo DIFF-END
      - run: npx eslint "{src,test}/**/*.ts" || true
