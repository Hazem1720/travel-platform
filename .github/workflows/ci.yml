name: CI

# Builds and tests the backend on every pull request and on pushes to the
# main branches. Needs no secrets: unit tests use placeholder settings and
# never connect to a database.
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Lint (TEMP, src only)
        continue-on-error: true
        run: npx eslint "src/**/*.ts"

      - name: Seed reference data into the throwaway database (TEMP)
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/e2e
          JWT_SECRET: e2e-test-secret-e2e-test-secret-123456
          FRONTEND_URL: http://localhost:3001
        run: npm run seed:reference

      - name: E2E with a real database (TEMP)
        env:
          E2E_MONGODB_URI: mongodb://127.0.0.1:27017/e2e
        run: npm run test:e2e -- --runInBand
