name: CI
on:
  pull_request:
jobs:
  test-plan:
    name: Test plan ${{ matrix.part }} (TEMP)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part:
          - part17-security.e2e-spec.ts
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run part
        run: npx jest --config ./test/jest-e2e.json --runInBand --forceExit test/${{ matrix.part }}
  audit:
    name: npm audit (TEMP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Production dependencies
        run: npm audit --omit=dev || true
      - name: All dependencies
        run: npm audit || true
